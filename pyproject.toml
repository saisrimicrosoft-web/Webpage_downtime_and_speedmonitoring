[project]
name = "pulseguard"
version = "1.0.0"
description = "Website uptime monitoring dashboard"
requires-python = ">=3.10"
dependencies = [
    "Flask",
    "SQLAlchemy",
    "Flask-SQLAlchemy",
    "alembic",
    "requests>=2.31.0",
    "APScheduler",
    "python-dotenv",
    "certifi",
    "pytest",
    "pytest-mock",
]

[tool.vercel]
entrypoint = "run:app"
